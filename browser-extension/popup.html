<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        body { font-family: system-ui, sans-serif; width: 280px; padding: 14px; }
        h3 { margin: 0 0 10px; font-size: 15px; }
        label { display: block; font-size: 12px; margin: 8px 0 2px; color: #444; }
        input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
        button { margin-top: 12px; width: 100%; padding: 8px; background: #6c4cf1; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #status { margin-top: 10px; font-size: 12px; }
        .ok { color: #16a34a; } .err { color: #dc2626; }
    </style>
</head>
<body>
    <h3>SOWAI Browser Agent</h3>
    <button id="auto">Auto-accoppia (usa la sessione Odoo)</button>
    <div id="status"></div>
    <details style="margin-top:12px">
        <summary style="font-size:12px;cursor:pointer;color:#666">Accoppiamento manuale (fallback)</summary>
        <label>Server SOWAI (URL)</label>
        <input id="base" placeholder="https://odootest.workingwithweb.eu"/>
        <label>Codice di accoppiamento</label>
        <input id="code" placeholder="6 cifre"/>
        <button id="pair">Accoppia con codice</button>
    </details>
    <script src="popup.js"></script>
</body>
</html>
